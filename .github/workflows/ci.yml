name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチの古い実行は、新しい push で取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripdiary
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # 写真の置き場(S3)の代わり。署名付き URL でのアップロード・取得を、実際の HTTP で確かめる
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tripdiary-e2e
          COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-1
        ports:
          - 9090:9090
    env:
      # CI 専用のテスト用の値(本物の秘密情報ではない)
      DATABASE_URL: mysql://tripdiary:tripdiary@127.0.0.1:3306/tripdiary
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_BUCKET: tripdiary-e2e
      S3_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: ci-only
      AWS_SECRET_ACCESS_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Prisma Client は生成物でコミットしていないため、ここで生成する
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      # API 仕様書(docs/api/openapi.json)が、コードから生成した内容と一致するか確認する。
      # 食い違うときは、`npm run openapi` で更新して、一緒にコミットする
      - run: node dist/openapi/generate-openapi.js --check
      - run: npm test
      - run: npx prisma migrate deploy
      # S3 互換のサーバーの起動を待つ
      - run: for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9090/ && break; sleep 2; done
      - run: npm run test:e2e
      # 本番のコンテナイメージが、ビルドでき、DB_* の環境変数だけで起動できることを確認する
      - name: Docker image (build and smoke test)
        working-directory: .
        run: |
          docker build -t tripdiary-backend backend
          docker run -d --name smoke --network host \
            -e DB_HOST=127.0.0.1 -e DB_NAME=tripdiary -e DB_USER=tripdiary -e DB_PASSWORD=tripdiary \
            -e JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-else tripdiary-backend
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health/live && break; sleep 1; done
          curl -sf localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/docs)" = 404
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0

  frontend:
    name: Frontend (lint, typecheck, unit, generate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # .nuxt の型定義を生成する(postinstall でも実行されるが、スキップされても確実に動くよう明示する)
      - run: npx nuxt prepare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # デプロイと同じ静的出力が作れることを確認する
      - run: npm run generate
      # 本番のビルド(HIDE_MOCK=true)に、ダミーデータの画面(/mock、/map)が入っていないことを確認する
      - name: Production build excludes mock pages
        run: |
          HIDE_MOCK=true npm run generate
          if grep -rq "清水寺" .output/public; then
            echo "mock data is included in the production build" >&2
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # E2E 専用のデータベース。e2e/support/env.ts の既定の接続先と揃えてある
          MYSQL_DATABASE: tripdiary_e2e
          MYSQL_USER: tripdiary
          MYSQL_PASSWORD: tripdiary
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # 写真の置き場(S3)の代わり。バケット名は、e2e/support/env.ts と揃えてある
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tripdiary-e2e
          COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-1
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # E2E は、バックエンドとフロントを実際に起動して操作する。両方の依存が必要
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # S3 互換のサーバーの起動を待つ
      - run: for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9090/ && break; sleep 2; done
      # DB のマイグレーション、サーバーの起動、後始末は、global-setup / webServer / global-teardown が行う
      - run: npm test
        working-directory: e2e
      # 失敗の調査用に、レポートとトレースを保存する
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
