services:
  db:
    image: mysql:8.4
    container_name: tripdiary-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripdiary}
      MYSQL_USER: ${MYSQL_USER:-tripdiary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tripdiary}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # 初回起動時に Prisma の shadow DB 用の権限を付与する
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 写真の置き場(S3)の代わり。開発・テスト用(AWS には接続しない)。署名付き URL・CORS が使える S3 互換のサーバー
  # バケット: tripdiary-local(開発)、tripdiary-e2e(結合テスト・E2E)。再起動すると、中身は消える
  s3:
    image: adobe/s3mock:latest
    container_name: tripdiary-s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tripdiary-local,tripdiary-e2e
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-1
    ports:
      - "9090:9090"

volumes:
  db-data:
